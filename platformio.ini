[platformio]
default_envs = wio_tracker_l2

[env:wio_tracker_l2]
platform = platformio/espressif32@6.11.0
board = seeed_wio_tracker_L2
framework = arduino
extra_scripts = pre:scripts/framework_paths.py
build_unflags =
  -std=gnu++11
  -std=c++11
lib_extra_dirs =
  lib
  lib/MeshCore/lib
monitor_speed = 115200
upload_speed = 115200
upload_protocol = esp-builtin
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
build_flags =
  -std=gnu++17
  -D ESP32_PLATFORM
  -D BOARD_HAS_PSRAM=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D RADIOLIB_STATIC_ONLY=1
  -D RADIOLIB_GODMODE=1
  -D RADIOLIB_EXCLUDE_CC1101=1
  -D RADIOLIB_EXCLUDE_RF69=1
  -D RADIOLIB_EXCLUDE_SX1231=1
  -D RADIOLIB_EXCLUDE_SI443X=1
  -D RADIOLIB_EXCLUDE_RFM2X=1
  -D RADIOLIB_EXCLUDE_SX128X=1
  -D LORA_FREQ=869.618
  -D LORA_BW=62.5
  -D LORA_SF=8
  -D LORA_CR=5
  -D LORA_TX_POWER=22
  -D P_LORA_DIO_1=9
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_DIO2_AS_RF_SWITCH=1
  -D LV_CONF_INCLUDE_SIMPLE
  -I include
lib_deps =
  bblanchon/ArduinoJson @ 7.4.3
  adafruit/Adafruit BusIO @ 1.17.4
  melopero/Melopero RV3028 @ 1.2.0
  electroniccats/CayenneLPP @ 1.6.1
  jgromes/RadioLib @ 7.7.1
  rweather/Crypto @ 0.4.0
  adafruit/RTClib @ 2.1.4
  lovyan03/LovyanGFX @ 1.2.25
  lvgl/lvgl @ 9.5.0
  adafruit/Adafruit ADS1X15 @ 2.6.2
  https://github.com/pschatzmann/arduino-audio-driver/archive/v0.2.1.zip
lib_ldf_mode = deep+
